  $('#mobileNav').classList.add('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (typeof renderMathInElement !== 'undefined') {
    try {
      renderMathInElement($('#app'), {
        delimiters: [
          {left:'$$', right:'$$', display:true},
          {left:'$', right:'$', display:false},
          {left:'\\(', right:'\\)', display:false},
          {left:'\\[', right:'\\]', display:true},
        ], throwOnError:false,
      });
    } catch(e) {}
  }
  if (id === 'ratio') loadRatioHistory();
  if (id === 'variation') setTimeout(renderVarChart, 50);
  if (id === 'triangle') setTimeout(renderTriangleInputs, 20);
  if (id === 'quiz') setTimeout(startQuiz, 20);
}

document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) { e.preventDefault(); navigate(navBtn.dataset.nav); return; }
});

$('#mobileBtn').onclick = () => $('#mobileNav').classList.toggle('hidden');
$('#darkBtn').onclick = () => {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  $('#darkIcon').className = `fa-solid ${isDark ? 'fa-sun' : 'fa-moon'} text-ink-700 dark:text-ink-100`;
  localStorage.setItem('dark', isDark);
};
$('#printBtn').onclick = () => window.print();

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === 'ratio-check') {
    const a = +$('#r-a').value, b = +$('#r-b').value, c = +$('#r-c').value, d = +$('#r-d').value;
    const out = $('#ratio-out');
    if (!a || !b || !c || !d) return out.innerHTML = err('يرجى إدخال جميع القيم الموجبة');
    if ([a,b,c,d].some(x => x <= 0)) return out.innerHTML = err('القيم يجب أن تكون موجبة');
    const ok = Math.abs(a/b - c/d) < 1e-9;
    out.innerHTML = ok
      ? okM(`النسبتان متكافئتان: ${a}/${b} = ${c}/${d} = ${(a/b).toFixed(4)}`)
      : err(`النسبتان غير متكافئتين: ${a}/${b}=${(a/b).toFixed(4)} ≠ ${c}/${d}=${(c/d).toFixed(4)}`);
    saveRatioHistory(a,b,c,d, (a/b).toFixed(4));
    return;
  }
  if (act === 'ratio-solve') {
    const a = +$('#r-a').value, b = +$('#r-b').value, c = +$('#r-c').value;
    const out = $('#ratio-out');
    if (!a || !b || !c) return out.innerHTML = err('أدخل a, b, c أولاً');
    if (a <= 0 || b <= 0 || c <= 0) return out.innerHTML = err('القيم يجب أن تكون موجبة');
    const d = (b*c)/a;
    $('#r-d').value = d.toFixed(4);
    out.innerHTML = `<div class="text-right">
      <p class="font-bold text-leaf-600 mb-2">✅ تم إيجاد d</p>
      <p class="text-xs mb-1">الضرب التبادلي: ${a} × d = ${b} × ${c}</p>
      <p class="text-xs mb-1">d = (${b} × ${c}) ÷ ${a} = <b>${d.toFixed(4)}</b></p>
    </div>`;
    saveRatioHistory(a,b,c,d, d.toFixed(4));
    return;
  }
  if (act === 'ratio-random') {
    const a = Math.floor(Math.random()*8)+2;
    const b = Math.floor(Math.random()*8)+2;
    const c = Math.floor(Math.random()*8)+2;
    $('#r-a').value = a; $('#r-b').value = b; $('#r-c').value = c;
    $('#r-d').value = (b*c)/a;
    $('#ratio-out').innerHTML = `<p class="text-brand-600">تم تحميل مثال.</p>`;
    return;
  }
  if (act === 'ratio-clear') {
    ['a','b','c','d'].forEach(x => $('#r-'+x).value = '');
    $('#ratio-out').innerHTML = `<p class="text-ink-700/60">تم المسح</p>`;
    return;
  }
  if (act === 'ratio-hist-clear') {
    localStorage.removeItem('ratioHist');
    loadRatioHistory();
    return;
  }

  if (act === 'tab-var') {
    varMode = btn.dataset.tab;
    $$('.tab-btn[data-act="tab-var"]').forEach(b => b.classList.toggle('tab-active', b.dataset.tab === varMode));
    renderVarChart();
    return;
  }
  if (act === 'var-calc') {
    const k = +$('#vk').value, x = +$('#vx').value;
    const out = $('#var-out');
    if (isNaN(k) || isNaN(x) || k === 0) return out.innerHTML = err('أدخل قيم صحيحة، k ≠ 0');
    if (varMode === 'inverse' && x === 0) return out.innerHTML = err('x لا يمكن أن يكون صفرًا في التغير العكسي');
    const y = varMode === 'direct' ? k*x : k/x;
    out.innerHTML = `<div class="text-right w-full">
      <p class="font-bold text-leaf-600">✅ النتيجة</p>
      <p class="text-sm mt-1">y = ${varMode === 'direct' ? `${k} × ${x}` : `${k} ÷ ${x}`} = <b>${y.toFixed(4)}</b></p>
    </div>`;
    let html = `<table class="w-full text-xs text-center"><thead><tr class="bg-brand-50 dark:bg-brand-900/20"><th class="p-2 rounded-r-lg">x</th>`;
    for (let i = 1; i <= 8; i++) html += `<th class="p-2">${i}</th>`;
    html += `</tr></thead><tbody><tr><td class="p-2 font-bold bg-ink-100 dark:bg-ink-800 rounded-r-lg">y</td>`;
    for (let i = 1; i <= 8; i++) {
      const yy = varMode === 'direct' ? k*i : k/i;
      html += `<td class="p-2 border-t border-ink-200 dark:border-ink-800">${yy.toFixed(2)}</td>`;
    }
    html += `</tr></tbody></table>`;
    $('#var-table').innerHTML = html;
    renderVarChart();
    return;
  }

  if (act === 'poly-check') {
    const s1 = $('#p1').value.split(',').map(Number).filter(n => n > 0);
    const s2 = $('#p2').value.split(',').map(Number).filter(n => n > 0);
    const out = $('#poly-out');
    if (s1.length !== s2.length || s1.length < 2) {
      out.innerHTML = err('يجب أن يكون للمضلعين نفس عدد الأضلاع (2 فأكثر)');
      return;
    }
    const k = s2[0]/s1[0];
    const similar = s1.every((v,i) => Math.abs(s2[i]/v - k) < 1e-6);
    if (!similar) { out.innerHTML = err('❌ المضلعان غير متشابهين'); return; }
    const p1 = s1.reduce((a,b)=>a+b,0), p2 = s2.reduce((a,b)=>a+b,0);
    out.innerHTML = `<p class="font-bold text-leaf-600 mb-2">✅ المضلعان متشابهان</p>
      <p class="text-xs">معامل التشابه k = <b>${k.toFixed(4)}</b></p>
      <p class="text-xs">نسبة المحيط = <b>${(p2/p1).toFixed(4)}</b> (تساوي k)</p>
      <p class="text-xs">نسبة المساحة = <b>${(k*k).toFixed(4)}</b> (تساوي k²)</p>`;
    drawPolySVG(s1, s2, k);
    return;
  }

  if (act === 'tri-check') {
    const c = $('#tri-case').value;
    const out = $('#tri-out');
    let res = '', ok = false;
    if (c === 'AA') {
      const a1 = +$('#t-a1').value, a2 = +$('#t-a2').value;
      const b1 = +$('#t-b1').value, b2 = +$('#t-b2').value;
      if (a1+a2 >= 180 || b1+b2 >= 180) return out.innerHTML = err('مجموع زاويتي المثلث يجب أن يكون < 180°');
      ok = (a1 === b1 && a2 === b2) || (a1 === b2 && a2 === b1);
      res = ok ? '✅ متشابهان بحالة AA' : '❌ غير متشابهين';
    } else if (c === 'SAS') {
      const s1a = +$('#s1a').value, s1b = +$('#s1b').value, a1 = +$('#sa1').value;
      const s2a = +$('#s2a').value, s2b = +$('#s2b').value, a2 = +$('#sa2').value;
      if (a1 !== a2) return out.innerHTML = err('الزاويتان المحصورتان غير متساويتين');
      ok = Math.abs(s1a/s2a - s1b/s2b) < 1e-6;
      res = ok ? `✅ متشابهان بحالة SAS (k = ${(s2a/s1a).toFixed(4)})` : '❌ غير متشابهين — نسب الأضلاع مختلفة';
    } else {
      const s1 = [+$('#x1').value, +$('#x2').value, +$('#x3').value].sort((a,b)=>a-b);
      const s2 = [+$('#y1').value, +$('#y2').value, +$('#y3').value].sort((a,b)=>a-b);
      const r = s1.map((v,i) => s2[i]/v);
      ok = r.every(v => Math.abs(v - r[0]) < 1e-6);
      res = ok ? `✅ متشابهان بحالة SSS (k = ${r[0].toFixed(4)})` : '❌ غير متشابهين';
    }
    out.innerHTML = `<p class="${ok ? 'text-leaf-600' : 'text-red-500'} font-bold text-lg">${res}</p>`;
    return;
  }

  if (act === 'tab-tech') {
    const t = btn.dataset.tab;
    $$('.tab-btn[data-act="tab-tech"]').forEach(b => b.classList.toggle('tab-active', b.dataset.tab === t));
    ['tower','mirror','model'].forEach(x => {
      const el = $('#tech-'+x);
      if (el) el.classList.toggle('section-hidden', x !== t);
    });
    return;
  }
  if (act === 'tw-calc') {
    const h = +$('#tw-h').value, s = +$('#tw-s').value, L = +$('#tw-L').value;
    const out = $('#tw-out');
    if (!h || !s || !L) return out.innerHTML = err('أدخل جميع القيم');
    if (s === 0) return out.innerHTML = err('ظل العصا لا يمكن أن يكون صفرًا');
    const H = (h/s) * L;
    out.innerHTML = `<div class="text-right">
      <p class="font-bold text-leaf-600 mb-2">✅ ارتفاع البرج</p>
      <p class="text-xs mb-1">H = (${h} ÷ ${s}) × ${L}</p>
      <p class="text-xs">H = <b>${H.toFixed(2)} متر</b></p>
    </div>`;
    return;
  }
  if (act === 'mr-calc') {
    const h = +$('#mr-h').value, d = +$('#mr-d').value, L = +$('#mr-L').value;
    const out = $('#mr-out');
    if (!h || !d || !L) return out.innerHTML = err('أدخل جميع القيم');
    if (d === 0) return out.innerHTML = err('بعد الشخص عن المرآة لا يمكن أن يكون صفرًا');
    const H = (h/d) * L;
    out.innerHTML = `<div class="text-right">
      <p class="font-bold text-leaf-600 mb-2">✅ ارتفاع الشجرة</p>
      <p class="text-xs mb-1">H = (${h} ÷ ${d}) × ${L}</p>
      <p class="text-xs">H = <b>${H.toFixed(2)} متر</b></p>
    </div>`;
    return;
  }
  if (act === 'md-calc') {
    const k = +$('#md-k').value, L = +$('#md-L').value;
    const out = $('#md-out');
    if (!k || !L) return out.innerHTML = err('أدخل جميع القيم');
    out.innerHTML = `<div class="text-right">
      <p class="font-bold text-leaf-600 mb-2">✅ الطول الحقيقي</p>
      <p class="text-xs">${L} × ${k} = <b>${(L*k).toFixed(2)} سم</b></p>
    </div>`;
    return;
  }
});

function err(msg){ return `<p class="text-red-500 font-bold text-sm text-center">${msg}</p>`; }
function okM(msg){ return `<p class="text-leaf-600 font-bold text-sm text-center">${msg}</p>`; }

function saveRatioHistory(a,b,c,d,res){
  const h = JSON.parse(localStorage.getItem('ratioHist') || '[]');
  h.unshift({a,b,c,d,res, t: new Date().toLocaleTimeString('ar-EG')});
  if (h.length > 20) h.pop();
  localStorage.setItem('ratioHist', JSON.stringify(h));
  loadRatioHistory();
}
function loadRatioHistory(){
  const box = $('#ratio-hist');
  if (!box) return;
  const h = JSON.parse(localStorage.getItem('ratioHist') || '[]');
  if (!h.length) { box.innerHTML = `<p class="text-center text-ink-700/50 dark:text-ink-100/40 text-xs">لا يوجد سجل بعد</p>`; return; }
  box.innerHTML = h.map(x => `
    <div class="p-2 rounded-lg bg-ink-50 dark:bg-ink-950 border border-ink-200 dark:border-ink-800 text-xs flex justify-between gap-2">
      <span>${x.a}:${x.b} = ${x.c}:${x.d}</span>
      <span class="text-ink-700/50">${x.t}</span>
    </div>`).join('');
}

function renderVarChart(){
  const canvas = $('#varChart');
  if (!canvas) return;
  const k = +($('#vk')?.value || 5);
  const xs = Array.from({length:10}, (_,i) => i+1);
  const ys = xs.map(x => varMode === 'direct' ? k*x : k/x);
  if (varChart) varChart.destroy();
  varChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: xs,
      datasets: [{
        label: varMode === 'direct' ? 'y = kx' : 'y = k/x',
        data: ys,
        borderColor: varMode === 'direct' ? '#2563eb' : '#f97316',
        backgroundColor: varMode === 'direct' ? 'rgba(37,99,235,0.1)' : 'rgba(249,115,22,0.1)',
        fill: true, tension: 0.3, borderWidth: 3, pointRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: 'rgba(148,163,184,0.15)' } },
        y: { beginAtZero: varMode === 'direct', grid: { color: 'rgba(148,163,184,0.15)' } }
      }
    }
  });
}

function renderTriangleInputs(){
  const c = $('#tri-case')?.value || 'AA';
  const box = $('#tri-inputs');
  if (!box) return;
  const inp = (id, label, val, min='1', max='179') => `
    <div>
      <label class="text-xs font-bold block mb-1">${label}</label>
      <input id="${id}" type="number" value="${val}" min="${min}" max="${max}" step="any" class="w-full px-3 py-2 rounded-xl bg-ink-50 dark:bg-ink-950 border-2 border-ink-200 dark:border-ink-800" />
    </div>`;
  if (c === 'AA') {
    box.innerHTML = `<div class="grid grid-cols-2 gap-2">
      ${inp('t-a1','م1 زاوية 1', 50)} ${inp('t-a2','م1 زاوية 2', 60)}
      ${inp('t-b1','م2 زاوية 1', 50)} ${inp('t-b2','م2 زاوية 2', 60)}
    </div>`;
  } else if (c === 'SAS') {
    box.innerHTML = `<div class="grid grid-cols-3 gap-2">
      ${inp('s1a','م1 ضلع 1', 4, '0.1')} ${inp('s1b','م1 ضلع 2', 6, '0.1')} ${inp('sa1','م1 زاوية', 60)}
      ${inp('s2a','م2 ضلع 1', 2, '0.1')} ${inp('s2b','م2 ضلع 2', 3, '0.1')} ${inp('sa2','م2 زاوية', 60)}
    </div>`;
  } else {
    box.innerHTML = `<div class="grid grid-cols-2 gap-2">
      ${inp('x1','م1 ضلع 1', 3, '0.1')} ${inp('y1','م2 ضلع 1', 6, '0.1')}
      ${inp('x2','م1 ضلع 2', 4, '0.1')} ${inp('y2','م2 ضلع 2', 8, '0.1')}
      ${inp('x3','م1 ضلع 3', 5, '0.1')} ${inp('y3','م2 ضلع 3', 10, '0.1')}
    </div>`;
  }
}
document.addEventListener('change', (e) => {
  if (e.target.id === 'tri-case') renderTriangleInputs();
});

function drawPolySVG(s1, s2, k){
  const box = $('#poly-svg');
  if (!box) return;
  const n = s1.length;
  const r1 = 60, r2 = Math.min(60 * k, 110);
  const cx1 = 90, cx2 = 240, cy = 100;
  const path = (cx, r) => {
    let p = '';
    for (let i = 0; i < n; i++) {
      const a = (i/n)*2*Math.PI - Math.PI/2;
      p += (i===0?'M':'L') + (cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1);
    }
    return p + 'Z';
  };
  box.innerHTML = `<svg viewBox="0 0 330 200" class="w-full max-w-sm">
    <path d="${path(cx1, r1)}" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="2"/>
    <path d="${path(cx2, r2)}" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="2"/>
    <text x="${cx1}" y="190" fill="#2563eb" text-anchor="middle" font-size="12" font-weight="bold">المضلع 1</text>
    <text x="${cx2}" y="190" fill="#f97316" text-anchor="middle" font-size="12" font-weight="bold">المضلع 2</text>
  </svg>`;
}

function startQuiz(){
  quizState = { idx:0, score:0 };
  renderQuizQ();
}
function renderQuizQ(){
  const q = QUIZ[quizState.idx];
  if (!q) return endQuiz();
  $('#q-num').textContent = quizState.idx + 1;
  $('#q-score').textContent = quizState.score;
  $('#q-bar').style.width = `${(quizState.idx / QUIZ.length) * 100}%`;
  $('#q-text').textContent = q.q;
  $('#q-opts').innerHTML = q.opts.map((o,i) => `
    <button data-q="${i}" class="q-opt w-full text-right px-4 py-3 rounded-xl bg-ink-50 dark:bg-ink-950 border-2 border-ink-200 dark:border-ink-800 hover:border-brand-500 transition font-medium">
      ${String.fromCharCode(65+i)}. ${o}
    </button>`).join('');
  $('#q-feedback').innerHTML = '';
  $('#q-next').classList.add('section-hidden');
  $('#q-restart').classList.add('section-hidden');
}
document.addEventListener('click', (e) => {
  const o = e.target.closest('.q-opt');
  if (o) {
    const idx = +o.dataset.q;
    const q = QUIZ[quizState.idx];
    $$('.q-opt').forEach((b,i) => {
      b.disabled = true;
      if (i === q.correct) b.classList.add('border-leaf-500', 'bg-leaf-400/10');
      else if (i === idx) b.classList.add('border-red-500', 'bg-red-50', 'dark:bg-red-900/20');
    });
    if (idx === q.correct) {
      quizState.score++;
      $('#q-feedback').innerHTML = `<p class="text-leaf-600 font-bold">✅ صحيح!</p>`;
    } else {
      $('#q-feedback').innerHTML = `<p class="text-red-500 font-bold">❌ الإجابة الصحيحة: ${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}</p>`;
    }
    $('#q-score').textContent = quizState.score;
    $('#q-next').classList.remove('section-hidden');
  }
  if (e.target.id === 'q-next') {
    quizState.idx++;
    if (quizState.idx >= QUIZ.length) endQuiz();
    else renderQuizQ();
  }
  if (e.target.id === 'q-restart') startQuiz();
});
function endQuiz(){
  $('#q-bar').style.width = '100%';
  $('#q-text').textContent = '🎉 انتهى الاختبار!';
  $('#q-opts').innerHTML = `<div class="text-center p-6 rounded-2xl bg-brand-50 dark:bg-brand-900/20">
    <p class="text-4xl font-black text-brand-700 dark:text-brand-200 mb-2">${quizState.score} / ${QUIZ.length}</p>
    <p class="text-sm text-ink-700 dark:text-ink-100/70">${quizState.score >= 7 ? '🏆 ممتاز!' : quizState.score >= 5 ? '👍 جيد' : '💪 حاول مرة أخرى'}</p>
  </div>`;
  $('#q-feedback').innerHTML = '';
  $('#q-next').classList.add('section-hidden');
  $('#q-restart').classList.remove('section-hidden');
}

function init(){
  if (localStorage.getItem('dark') === 'true') {
    document.documentElement.classList.add('dark');
    $('#darkIcon').className = 'fa-solid fa-sun text-ink-700 dark:text-ink-100';
  }
  renderNav();
  navigate('home');
}
window.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
</script>
</body>
</html>
